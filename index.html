<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone Battery Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a26;
    --border: rgba(255,255,255,0.07);
    --green: #00e87a; --green-dim: rgba(0,232,122,0.12); --green-border: rgba(0,232,122,0.25);
    --orange: #ff9f0a; --red: #ff453a; --blue: #0a84ff;
    --text: #f0f0f8; --muted: rgba(240,240,248,0.45);
    --mono: 'DM Mono', monospace; --sans: 'Syne', sans-serif;
  }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:40px 20px 80px; }
  body::before { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events:none; z-index:0; opacity:0.6; }
  .wrapper { position:relative; z-index:1; width:100%; max-width:560px; }
  header { text-align:center; margin-bottom:48px; }
  .logo { display:inline-flex; align-items:center; gap:10px; background:var(--green-dim); border:1px solid var(--green-border); border-radius:100px; padding:6px 16px; margin-bottom:24px; font-family:var(--mono); font-size:11px; color:var(--green); letter-spacing:1px; }
  .logo-dot { width:6px; height:6px; background:var(--green); border-radius:50%; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }
  h1 { font-size:clamp(28px,6vw,40px); font-weight:800; line-height:1.1; letter-spacing:-1px; }
  h1 span { color:var(--green); }
  .subtitle { color:var(--muted); font-size:14px; margin-top:10px; font-family:var(--mono); }
  .upload-zone { border:2px dashed var(--border); border-radius:20px; padding:48px 32px; text-align:center; cursor:pointer; transition:all 0.3s ease; background:var(--surface); position:relative; overflow:hidden; }
  .upload-zone::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 0%,rgba(0,232,122,0.05) 0%,transparent 70%); pointer-events:none; }
  .upload-zone:hover,.upload-zone.drag { border-color:var(--green-border); background:var(--surface2); }
  .upload-zone.drag { transform:scale(1.01); }
  .upload-icon { font-size:48px; margin-bottom:16px; display:block; }
  .upload-title { font-size:18px; font-weight:700; margin-bottom:8px; }
  .upload-sub { font-family:var(--mono); font-size:12px; color:var(--muted); }
  .upload-sub span { color:var(--green); }
  #fileInput { display:none; }
  .history-label { font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:1px; margin:32px 0 12px; text-transform:uppercase; }
  .month-filter { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .month-tab { font-family:var(--mono); font-size:11px; background:var(--surface2); border:1px solid var(--border); border-radius:100px; padding:4px 12px; cursor:pointer; transition:all 0.2s; color:var(--muted); }
  .month-tab:hover { border-color:var(--green-border); color:var(--green); }
  .month-tab.active { background:var(--green-dim); border-color:var(--green-border); color:var(--green); font-weight:500; }
  .history-list { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:32px; }
  .history-pill { font-family:var(--mono); font-size:11px; background:var(--surface2); border:1px solid var(--border); border-radius:100px; padding:4px 12px; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; gap:6px; }
  .history-pill:hover { border-color:var(--green-border); color:var(--green); }
  .history-pill.active-pill { border-color:var(--green-border); color:var(--green); background:var(--green-dim); }
  .history-pill .dot { width:5px; height:5px; border-radius:50%; background:var(--green); }
  .history-empty { font-family:var(--mono); font-size:11px; color:var(--muted); padding:8px 0; }
  .result { animation:fadeUp 0.5s ease forwards; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  .card-header { background:var(--surface); border:1px solid var(--border); border-radius:20px 20px 0 0; padding:20px 24px; display:flex; align-items:center; justify-content:space-between; }
  .card-title { font-size:16px; font-weight:700; }
  .card-date { font-family:var(--mono); font-size:11px; color:var(--muted); }
  .badge { font-family:var(--mono); font-size:11px; padding:4px 12px; border-radius:100px; font-weight:500; }
  .badge-green { background:var(--green-dim); color:var(--green); border:1px solid var(--green-border); }
  .badge-orange { background:rgba(255,159,10,0.12); color:var(--orange); border:1px solid rgba(255,159,10,0.25); }
  .badge-red { background:rgba(255,69,58,0.12); color:var(--red); border:1px solid rgba(255,69,58,0.25); }
  .health-section { background:var(--surface); border-left:1px solid var(--border); border-right:1px solid var(--border); padding:28px 24px; display:flex; align-items:center; gap:24px; }
  .health-ring { position:relative; width:96px; height:96px; flex-shrink:0; }
  .health-ring svg { transform:rotate(-90deg); }
  .health-ring-text { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .health-num { font-size:24px; font-weight:800; line-height:1; }
  .health-pct { font-family:var(--mono); font-size:10px; color:var(--muted); }
  .health-info h3 { font-size:14px; font-weight:600; margin-bottom:4px; }
  .health-info p { font-family:var(--mono); font-size:12px; color:var(--muted); line-height:1.6; }
  /* Score bar */
  .score-section { background:var(--surface); border-left:1px solid var(--border); border-right:1px solid var(--border); border-top:1px solid var(--border); padding:18px 24px; }
  .score-label { font-family:var(--mono); font-size:10px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:10px; }
  .score-bar-wrap { background:rgba(255,255,255,0.06); border-radius:8px; height:20px; overflow:hidden; margin-bottom:6px; }
  .score-bar { height:100%; border-radius:8px; transition:width 1s ease; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; }
  .score-bar span { font-family:var(--mono); font-size:11px; font-weight:700; color:#000; }
  .score-desc { font-family:var(--mono); font-size:11px; color:var(--muted); }
  /* Stats grid */
  .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--border); border-left:1px solid var(--border); border-right:1px solid var(--border); }
  .stat-box { background:var(--surface); padding:18px 20px; }
  .stat-label { font-family:var(--mono); font-size:10px; color:var(--muted); letter-spacing:0.5px; text-transform:uppercase; margin-bottom:6px; }
  .stat-value { font-size:26px; font-weight:700; line-height:1; }
  .stat-unit { font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:2px; }
  .stat-change { font-family:var(--mono); font-size:10px; margin-top:4px; }
  .up { color:var(--green); } .down { color:var(--orange); } .same { color:var(--muted); }
  /* Drop alert */
  .drop-alert { background:rgba(255,69,58,0.08); border:1px solid rgba(255,69,58,0.3); border-left:1px solid rgba(255,69,58,0.3); border-right:1px solid rgba(255,69,58,0.3); padding:14px 20px; display:flex; gap:10px; align-items:flex-start; }
  /* Explanation */
  .explanation { background:var(--surface); border-left:1px solid var(--border); border-right:1px solid var(--border); border-top:1px solid var(--border); padding:20px 24px; }
  .explanation h4 { font-size:13px; font-weight:700; margin-bottom:14px; font-family:var(--mono); color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
  .exp-item { margin-bottom:14px; }
  .exp-item:last-child { margin-bottom:0; }
  .exp-key { font-size:13px; font-weight:700; color:var(--green); margin-bottom:3px; }
  .exp-val { font-size:13px; color:var(--muted); line-height:1.6; }
  /* Verdict */
  .verdict { background:var(--green-dim); border:1px solid var(--green-border); border-radius:0 0 20px 20px; padding:18px 24px; font-size:14px; line-height:1.6; }
  .verdict strong { color:var(--green); }
  /* Cards section */
  .cards-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
  .info-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; }
  /* BH Predict card */
  .predict-card { border-radius:16px; padding:18px 20px; margin-top:16px; }
  /* Summary card */
  .summary-card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px 24px; margin-top:16px; }
  .summary-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
  .summary-item { }
  .summary-item-label { font-family:var(--mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:3px; }
  .summary-item-val { font-size:18px; font-weight:700; }
  /* Chart */
  .chart-section { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px 24px; margin-top:16px; }
  .chart-title { font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:16px; }
  .chart-wrap { position:relative; height:120px; }
  canvas { width:100%!important; }
  /* Trend */
  .trend-section { margin-top:16px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px 24px; }
  .trend-title { font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:16px; }
  .trend-row { display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--border); }
  .trend-row:last-child { border-bottom:none; }
  .trend-date { font-family:var(--mono); font-size:10px; color:var(--muted); width:80px; flex-shrink:0; }
  .trend-bar-wrap { flex:1; background:rgba(255,255,255,0.05); border-radius:4px; height:6px; overflow:hidden; }
  .trend-bar { height:100%; border-radius:4px; background:var(--green); }
  .trend-val { font-family:var(--mono); font-size:10px; width:52px; text-align:right; flex-shrink:0; }
  /* Notes */
  .notes-section { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px 24px; margin-top:16px; }
  .notes-title { font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:12px; }
  .notes-input { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; color:var(--text); font-family:var(--mono); font-size:12px; resize:none; outline:none; transition:border 0.2s; }
  .notes-input:focus { border-color:var(--green-border); }
  .notes-save { margin-top:8px; padding:8px 16px; background:var(--green-dim); border:1px solid var(--green-border); border-radius:8px; color:var(--green); font-family:var(--mono); font-size:11px; cursor:pointer; transition:all 0.2s; }
  .notes-save:hover { background:var(--green); color:#000; }
  .notes-saved { font-family:var(--mono); font-size:11px; color:var(--green); margin-left:8px; opacity:0; transition:opacity 0.3s; }
  /* Actions */
  .actions { display:flex; gap:10px; margin-top:20px; }
  .btn { flex:1; padding:12px; border-radius:12px; font-family:var(--sans); font-size:13px; font-weight:700; cursor:pointer; border:none; transition:all 0.2s; }
  .btn-primary { background:var(--green); color:#000; }
  .btn-primary:hover { opacity:0.9; transform:translateY(-1px); }
  .btn-ghost { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
  .btn-ghost:hover { border-color:var(--green-border); }
  .error-box { background:rgba(255,69,58,0.1); border:1px solid rgba(255,69,58,0.3); border-radius:12px; padding:16px; font-family:var(--mono); font-size:13px; color:var(--red); text-align:center; margin-top:16px; }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <div class="logo"><span class="logo-dot"></span>BATTERY ANALYZER</div>
    <h1>iPhone <span>Battery</span><br>Real Stats</h1>
    <p class="subtitle">// upload file .synced dari iPhone kamu</p>
  </header>
  <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <span class="upload-icon">🔋</span>
    <div class="upload-title">Drop file .synced di sini</div>
    <div class="upload-sub">atau klik untuk pilih file &nbsp;·&nbsp; format: <span>Analytics-YYYY-MM-DD-*.synced</span></div>
    <input type="file" id="fileInput" accept=".synced">
  </div>
  <div id="errorBox" class="error-box" style="display:none"></div>
  <div id="historySection" style="display:none">
    <div class="history-label">📂 Riwayat file sebelumnya</div>
    <div class="month-filter" id="monthFilter"></div>
    <div class="history-list" id="historyList"></div>
  </div>
  <div id="resultContainer" style="margin-top:32px"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
// ── Supabase Config — GANTI dengan credentials kamu ─────────────────
const SUPABASE_URL = 'https://giuzviqlijitzpbsipya.supabase.co'; // contoh: https://abcdef.supabase.co
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpdXp2aXFsaWppdHpwYnNpcHlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MjYzNDQsImV4cCI6MjEwNTEwMjM0NH0.B7gGq0BIDKxXNXCFED0q5TduzmCiCw_mXw0ghLnFc5U';
const SB_HEADERS   = { 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY };
const SB_OK        = !SUPABASE_URL.includes('GANTI'); // false kalau belum diisi

// ── Supabase API helpers (dengan timeout 5 detik) ─────────────────────
async function sbFetch(path, options={}) {
  if (!SB_OK) return null; // skip kalau credentials belum diisi
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 5000);
  try {
    const res = await fetch(SUPABASE_URL+'/rest/v1/'+path, {
      headers: SB_HEADERS, signal: controller.signal, ...options
    });
    clearTimeout(timer);
    if (!res.ok) { console.error('SB error:', res.status, await res.text()); return null; }
    return res.status === 204 ? true : res.json().catch(()=>null);
  } catch(e) {
    clearTimeout(timer);
    console.warn('SB fetch failed:', e.message);
    return null;
  }
}

// ── Storage: Supabase + localStorage fallback ─────────────────────────
const NOTES_KEY = 'batteryNotes';
let activeMonth  = 'all';
let currentDate  = null;
let bhChart      = null;
let _cache       = null;

function lsGet() { try { return JSON.parse(localStorage.getItem('batteryHistory')||'[]'); } catch { return []; } }
function lsSet(h) { try { localStorage.setItem('batteryHistory', JSON.stringify(h.slice(0,200))); } catch {} }

async function getHistory() {
  if (_cache) return _cache;
  if (SB_OK) {
    const data = await sbFetch('battery_logs?select=*&order=date.desc&limit=200');
    if (Array.isArray(data) && data.length >= 0) {
      _cache = data.map(r => ({
        date: r.date, filename: r.filename||'',
        nom: r.nominal, pct: r.bh,
        raw: { MaximumFCC:r.fcc, NominalChargeCapacity:r.nominal,
               AppleRawMaxCapacity:r.raw_max, CycleCount:r.cycle_count,
               MaximumCapacityPercent:r.bh, _formatType:'full' }
      }));
      // sync ke localStorage sebagai backup
      lsSet(_cache);
      return _cache;
    }
  }
  // fallback: pakai localStorage
  return lsGet();
}

async function saveHistory(entry) {
  _cache = null;
  // selalu save localStorage dulu biar nggak hilang
  const h = lsGet().filter(x=>x.date!==entry.date);
  h.unshift(entry); lsSet(h);
  // lalu coba save ke Supabase
  if (SB_OK) {
    await sbFetch('battery_logs?on_conflict=date', {
      method: 'POST',
      body: JSON.stringify({
        date: entry.date, filename: entry.filename||'',
        nominal: entry.nom||null, bh: entry.pct||null,
        fcc: entry.raw?.MaximumFCC||null,
        raw_max: entry.raw?.AppleRawMaxCapacity||null,
        cycle_count: entry.raw?.CycleCount||null,
        raw_data: entry.raw||null
      }),
      headers: { ...SB_HEADERS, 'Prefer':'resolution=merge-duplicates' }
    });
  }
}

async function deleteHistoryFromDB(date) {
  _cache = null;
  lsSet(lsGet().filter(x=>x.date!==date));
  if (SB_OK) await sbFetch('battery_logs?date=eq.'+date, { method:'DELETE' });
}

function getNotes() { try { return JSON.parse(localStorage.getItem(NOTES_KEY)||'{}'); } catch { return {}; } }
function saveNote(date, note) { const n=getNotes(); n[date]=note; localStorage.setItem(NOTES_KEY,JSON.stringify(n)); }
function getYearMonth(d) { return d ? d.slice(0,7) : ''; }
function formatMonthLabel(ym) {
  if (!ym) return '';
  const [y,m] = ym.split('-');
  return ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][parseInt(m)-1]+' '+y;
}

// ── Parser ────────────────────────────────────────────────────────────
function parseFile(text) {
  const result = {};
  ['MaximumFCC','NominalChargeCapacity','CycleCount','MaximumCapacityPercent','AppleRawMaxCapacity','BatteryHealthMetric'].forEach(k => {
    const m = text.match(new RegExp('"last_value_'+k+'":(\\d+)'));
    if (m) result[k] = parseInt(m[1]);
  });
  if (!result.MaximumCapacityPercent) {
    const m = text.match(/"maximumCapacityPercent":(\d+)/);
    if (m) result.MaximumCapacityPercent = parseInt(m[1]);
  }
  const trustedM = text.match(/"batteryTrusted":(true|false)/);
  result.batteryTrusted = trustedM ? trustedM[1]==='true' : null;
  const discM = text.match(/"BatteryCellDisconnectCount_Last_Value_Of_Day"[\s\S]*?"last_value_value":(\d+)/);
  result.cellDisconnect = discM ? parseInt(discM[1]) : null;
  const rollM = text.match(/"rolloverReason":"([^"]+)"/);
  result.rolloverReason = rollM ? rollM[1] : null;
  const hasDetail  = !!(result.MaximumFCC || result.NominalChargeCapacity);
  const hasBH      = !!result.MaximumCapacityPercent;
  const hasNewData = result.batteryTrusted !== null || result.cellDisconnect !== null;
  result._formatType = hasDetail ? 'full' : (hasBH||hasNewData ? 'partial' : 'none');
  return result;
}

function extractDate(fn) { const m=fn.match(/(\d{4}-\d{2}-\d{2})/); return m?m[1]:'Unknown'; }

// ── Health helpers ────────────────────────────────────────────────────
function healthColor(p) { return p>=90?'var(--green)':p>=80?'var(--orange)':'var(--red)'; }
function healthBadge(p) {
  if (p>=90) return ['badge-green','Excellent 🔥'];
  if (p>=80) return ['badge-orange','Good ✅'];
  return ['badge-red','Perlu Perhatian ⚠️'];
}
function healthDesc(p) {
  if (p>=100) return 'Baterai kamu bahkan <strong>melebihi spesifikasi pabrik</strong>! Kondisi terbaik yang mungkin ada.';
  if (p>=95)  return 'Baterai masih dalam kondisi <strong>prima banget</strong>. Nggak ada yang perlu dikhawatirkan.';
  if (p>=90)  return 'Kondisi baterai <strong>masih sangat baik</strong>. Degradasi ringan yang wajar.';
  if (p>=80)  return 'Baterai mulai menua tapi <strong>masih layak pakai</strong>.';
  return 'Kapasitas baterai <strong>di bawah 80%</strong>. Apple rekomendasiin ganti baterai di titik ini.';
}
function cycleDesc(c) {
  if (!c) return '';
  if (c<50)  return 'Masih <strong>sangat baru</strong> — fase kalibrasi mungkin masih berjalan.';
  if (c<150) return 'Siklus '+c+' — baterai masih <strong>muda</strong>, jauh dari batas 500.';
  if (c<300) return 'Siklus '+c+' — memasuki <strong>fase pertengahan</strong>. Pantau rutin.';
  if (c<500) return 'Siklus '+c+' — sudah <strong>setengah jalan</strong> menuju 500.';
  return 'Siklus '+c+' — <strong>melewati batas 500</strong>. Pertimbangkan ganti baterai.';
}

// ── Charging Habit Score ──────────────────────────────────────────────
function calcScore(nom, prev, cyc, prevCyc) {
  let score = 100;
  let reasons = [];
  // Penalti drop Nominal
  if (nom && prev && prev>0) {
    const drop = prev - nom;
    if (drop > 20) { score -= 30; reasons.push('Nominal drop drastis ('+drop+' mAh)'); }
    else if (drop > 10) { score -= 15; reasons.push('Nominal turun cukup banyak ('+drop+' mAh)'); }
    else if (drop > 5)  { score -= 5;  reasons.push('Nominal turun tipis ('+drop+' mAh)'); }
    else if (drop < -5) { score += 5; } // bonus naik
  }
  // Penalti cycle terlalu cepat
  if (cyc && prevCyc) {
    const cycDay = cyc - prevCyc;
    if (cycDay > 2)     { score -= 20; reasons.push('Cycle nambah '+cycDay+' dalam sehari (terlalu intensif)'); }
    else if (cycDay > 1){ score -= 5;  reasons.push('Cycle nambah '+cycDay); }
  }
  score = Math.max(0, Math.min(100, score));
  return { score, reasons };
}

function scoreLabel(s) {
  if (s>=85) return { label:'Excellent 🏆', color:'var(--green)' };
  if (s>=70) return { label:'Good 👍', color:'#5ac8fa' };
  if (s>=50) return { label:'Fair ⚠️', color:'var(--orange)' };
  return { label:'Needs Work 🔴', color:'var(--red)' };
}

// ── Ring SVG ──────────────────────────────────────────────────────────
function ring(pct, color) {
  const r=40, c=2*Math.PI*r, fill=Math.min(pct,100);
  return '<svg width="96" height="96" viewBox="0 0 96 96">'
    +'<circle cx="48" cy="48" r="'+r+'" stroke="rgba(255,255,255,0.06)" stroke-width="8" fill="none"/>'
    +'<circle cx="48" cy="48" r="'+r+'" stroke="'+color+'" stroke-width="8" fill="none"'
    +' stroke-dasharray="'+c+'" stroke-dashoffset="'+(c-(fill/100)*c)+'"'
    +' stroke-linecap="round" style="transition:stroke-dashoffset 1s ease"/>'
    +'</svg>';
}

function changeBadge(cur, prev, unit) {
  if (prev==null||cur==null) return '';
  const d=cur-prev;
  if (d>0) return '<div class="stat-change up">▲ +'+d+unit+' dari sebelumnya</div>';
  if (d<0) return '<div class="stat-change down">▼ '+d+unit+' dari sebelumnya</div>';
  return '<div class="stat-change same">— sama seperti sebelumnya</div>';
}

// ── BH Prediction ─────────────────────────────────────────────────────
function buildPrediction(nom, pct, fcc, history) {
  if (!nom || !pct || history.length < 3) return '';
  const recentWithNom = history.filter(h=>h.nom&&h.nom>0).slice(0,6);
  if (recentWithNom.length < 2) return '';
  const oldest = recentWithNom[recentWithNom.length-1];
  const newest = recentWithNom[0];
  const daysDiff = Math.max(1,(new Date(newest.date)-new Date(oldest.date))/(1000*60*60*24));
  const ratePerDay = (oldest.nom - newest.nom) / daysDiff;
  const designCap = fcc ? fcc*0.955 : 3279;
  const thresholds = [99,98,97,96,95,90,85,80].map(bh=>({ bh, nom: Math.round(designCap*(bh/100)) }));
  const next = thresholds.find(t=>t.nom<nom);
  if (!next) return '';

  if (ratePerDay<=0) {
    return '<div class="predict-card" style="background:rgba(0,232,122,0.06);border:1px solid rgba(0,232,122,0.2)">'
      +'<div style="font-family:var(--mono);font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">🟢 PREDIKSI PENURUNAN BH</div>'
      +'<div style="font-size:15px;font-weight:700;color:var(--green)">Nominal sedang naik atau stabil ✅</div>'
      +'<div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px">BH tidak akan turun dalam waktu dekat selama tren ini berlanjut.</div>'
      +'</div>';
  }

  const nomGap   = nom - next.nom;
  const daysLeft = Math.round(nomGap / ratePerDay);
  const target   = new Date(); target.setDate(target.getDate()+daysLeft);
  const targetStr= target.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  const urgency  = daysLeft<14?'red':daysLeft<30?'orange':'green';
  const uc = urgency==='red'?'var(--red)':urgency==='orange'?'var(--orange)':'var(--green)';
  const ub = urgency==='red'?'rgba(255,69,58,0.08)':urgency==='orange'?'rgba(255,159,10,0.08)':'rgba(0,232,122,0.06)';
  const ubr= urgency==='red'?'rgba(255,69,58,0.3)':urgency==='orange'?'rgba(255,159,10,0.3)':'rgba(0,232,122,0.2)';
  const icon = urgency==='red'?'🔴':urgency==='orange'?'🟠':'🟢';

  return '<div class="predict-card" style="background:'+ub+';border:1px solid '+ubr+'">'
    +'<div style="font-family:var(--mono);font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">'+icon+' PREDIKSI PENURUNAN BH</div>'
    +'<div style="display:flex;align-items:flex-end;gap:6px;margin-bottom:4px">'
    +'<span style="font-size:36px;font-weight:800;color:'+uc+';line-height:1">'+daysLeft+'</span>'
    +'<span style="font-size:14px;color:var(--muted);padding-bottom:5px">hari lagi</span></div>'
    +'<div style="font-size:14px;font-weight:600;margin-bottom:4px">BH kemungkinan turun ke <span style="color:'+uc+'">'+next.bh+'%</span></div>'
    +'<div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:12px">estimasi sekitar '+targetStr+'</div>'
    +'<div style="background:rgba(255,255,255,0.04);border-radius:10px;padding:12px">'
    +'<div style="font-family:var(--mono);font-size:10px;color:rgba(255,255,255,0.35);margin-bottom:8px;letter-spacing:1px">DETAIL KALKULASI</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-family:var(--mono);font-size:11px">'
    +'<div style="color:var(--muted)">Nominal sekarang</div><div>'+nom+' mAh</div>'
    +'<div style="color:var(--muted)">Threshold '+next.bh+'%</div><div>'+next.nom+' mAh</div>'
    +'<div style="color:var(--muted)">Sisa turun</div><div style="color:'+uc+'">'+nomGap+' mAh</div>'
    +'<div style="color:var(--muted)">Rate penurunan</div><div>~'+ratePerDay.toFixed(1)+' mAh/hari</div>'
    +'</div></div>'
    +'<div style="font-family:var(--mono);font-size:10px;color:rgba(255,255,255,0.25);margin-top:10px">* estimasi dari '+recentWithNom.length+' data terakhir — bisa berubah tergantung pola charging</div>'
    +'</div>';
}

// ── Summary Stats ─────────────────────────────────────────────────────
function buildSummary(nom, pct, fcc, cyc, history) {
  const h = history.filter(x=>x.nom&&x.nom>0);
  if (h.length < 2) return '';
  const first = h[h.length-1];
  const oldest = new Date(first.date);
  const today  = new Date();
  const totalDays = Math.round((today-oldest)/(1000*60*60*24));
  const peakNom = Math.max(...h.map(x=>x.nom));
  const dropTotal = peakNom - (nom||0);
  const avgCycleDay = cyc && totalDays ? (cyc/totalDays).toFixed(2) : '–';

  // Estimasi umur ke 80%
  const designCap = fcc ? fcc*0.955 : 3279;
  const thresh80  = Math.round(designCap*0.80);
  const recentWithNom = h.slice(0,5);
  let lifeEst = '–';
  if (recentWithNom.length>=2 && nom) {
    const oDays = Math.max(1,(new Date(recentWithNom[0].date)-new Date(recentWithNom[recentWithNom.length-1].date))/(1000*60*60*24));
    const rate  = (recentWithNom[recentWithNom.length-1].nom - recentWithNom[0].nom) / oDays;
    if (rate>0) {
      const dLeft = Math.round((nom-thresh80)/rate);
      lifeEst = dLeft > 0 ? Math.round(dLeft/30)+' bulan' : 'Segera';
    }
  }

  return '<div class="summary-card">'
    +'<div style="font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px">📊 Ringkasan Keseluruhan</div>'
    +'<div class="summary-grid">'
    +'<div class="summary-item"><div class="summary-item-label">Hari Pemakaian</div><div class="summary-item-val">'+totalDays+' hari</div></div>'
    +'<div class="summary-item"><div class="summary-item-label">Avg Cycle/Hari</div><div class="summary-item-val">'+avgCycleDay+'</div></div>'
    +'<div class="summary-item"><div class="summary-item-label">Drop dari Puncak</div><div class="summary-item-val" style="color:'+(dropTotal>30?'var(--orange)':'var(--green)')+'">-'+dropTotal+' mAh</div></div>'
    +'<div class="summary-item"><div class="summary-item-label">Estimasi ke 80%</div><div class="summary-item-val" style="color:var(--green)">'+lifeEst+'</div></div>'
    +'</div></div>';
}

// ── Chart ─────────────────────────────────────────────────────────────
function buildChart(history) {
  const h = history.filter(x=>x.nom&&x.nom>0).slice(0,20).reverse();
  if (h.length < 3) return '';
  return '<div class="chart-section">'
    +'<div class="chart-title">📈 Tren Nominal & BH</div>'
    +'<div class="chart-wrap"><canvas id="bhChartCanvas"></canvas></div>'
    +'</div>';
}

function initChart(history) {
  const h = history.filter(x=>x.nom&&x.nom>0).slice(0,20).reverse();
  if (h.length < 3) return;
  const ctx = document.getElementById('bhChartCanvas');
  if (!ctx) return;
  if (bhChart) { bhChart.destroy(); bhChart=null; }
  bhChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: h.map(x=>x.date.slice(5)),
      datasets: [
        { label:'Nominal (mAh)', data:h.map(x=>x.nom), borderColor:'#00e87a', backgroundColor:'rgba(0,232,122,0.08)', tension:0.3, pointRadius:3, yAxisID:'y' },
        { label:'BH (%)', data:h.map(x=>x.pct), borderColor:'#0a84ff', backgroundColor:'rgba(10,132,255,0.06)', tension:0.3, pointRadius:3, yAxisID:'y1', borderDash:[4,4] }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ labels:{ color:'rgba(240,240,248,0.5)', font:{size:10}, boxWidth:20 } } },
      scales: {
        x:{ ticks:{ color:'rgba(240,240,248,0.35)', font:{size:9} }, grid:{ color:'rgba(255,255,255,0.04)' } },
        y:{ position:'left', ticks:{ color:'rgba(240,240,248,0.35)', font:{size:9} }, grid:{ color:'rgba(255,255,255,0.04)' } },
        y1:{ position:'right', ticks:{ color:'rgba(10,132,255,0.5)', font:{size:9} }, grid:{ drawOnChartArea:false } }
      }
    }
  });
}

// ── Render ────────────────────────────────────────────────────────────
async function render(data, date, filename, prev) {
  currentDate = date;
  const pct  = data.MaximumCapacityPercent ?? 0;
  const fcc  = data.MaximumFCC ?? null;
  const nom  = data.NominalChargeCapacity ?? null;
  const raw  = data.AppleRawMaxCapacity ?? null;
  const cyc  = data.CycleCount ?? null;
  const isPartial = data._formatType === 'partial';
  const [badgeClass, badgeText] = healthBadge(pct);
  const color = healthColor(pct);
  const history = await getHistory();

  // Drop alert
  const dropThreshold = 15;
  let dropAlertHTML = '';
  if (nom && prev && prev.NominalChargeCapacity) {
    const drop = prev.NominalChargeCapacity - nom;
    if (drop >= dropThreshold) {
      dropAlertHTML = '<div class="drop-alert">'
        +'<span style="font-size:20px;flex-shrink:0">⚠️</span>'
        +'<div style="font-family:var(--mono);font-size:11px;color:rgba(255,69,58,0.9);line-height:1.7">'
        +'<strong>Nominal drop drastis −'+drop+' mAh dari kemarin!</strong><br>'
        +'Kemungkinan penyebab: bablas cas 100% semalaman · update iOS · HP kepanasan parah · gaming berat sambil cas.'
        +'</div></div>';
    }
  }

  // Charging Habit Score
  const prevNom  = prev?.NominalChargeCapacity ?? null;
  const prevCyc  = prev?.CycleCount ?? null;
  const { score, reasons } = calcScore(nom, prevNom, cyc, prevCyc);
  const { label: scoreLabel2, color: scoreColor } = scoreLabel(score);
  const scoreHTML = nom ? '<div class="score-section">'
    +'<div class="score-label">🎯 Charging Habit Score</div>'
    +'<div class="score-bar-wrap"><div class="score-bar" style="width:'+score+'%;background:'+scoreColor+'"><span>'+score+'</span></div></div>'
    +'<div class="score-desc">'+scoreLabel2+(reasons.length?' — '+reasons[0]:'')+'</div>'
    +'</div>' : '';

  // BH Prediction
  const predHTML = buildPrediction(nom, pct, fcc, history);

  // Summary
  const summHTML = buildSummary(nom, pct, fcc, cyc, history);

  // Chart
  const chartHTML = buildChart(history);

  // Trend bars
  let trendHTML = '';
  const withNom = history.filter(x=>x.nom&&x.nom>0);
  if (withNom.length > 1) {
    const maxNom = Math.max(...withNom.map(x=>x.nom));
    trendHTML = '<div class="trend-section">'
      +'<div class="trend-title">📋 Tren NominalCharge</div>'
      +withNom.map(h=>'<div class="trend-row">'
        +'<div class="trend-date">'+h.date+'</div>'
        +'<div class="trend-bar-wrap"><div class="trend-bar" style="width:'+((h.nom/maxNom)*100).toFixed(1)+'%"></div></div>'
        +'<div class="trend-val" style="color:'+healthColor(h.pct)+'">'+h.nom+'</div>'
        +'</div>').join('')
      +'</div>';
  }

  // Notes
  const notes = getNotes();
  const existingNote = notes[date] || '';
  const notesHTML = '<div class="notes-section">'
    +'<div class="notes-title">📝 Catatan Hari Ini</div>'
    +'<textarea class="notes-input" id="noteInput" rows="2" placeholder="Contoh: bablas 100%, update iOS, HP sempat panas...">'+(existingNote)+'</textarea>'
    +'<div style="display:flex;align-items:center">'
    +'<button class="notes-save" onclick="saveCurrentNote()">Simpan Catatan</button>'
    +'<span class="notes-saved" id="notesSaved">✓ Tersimpan</span>'
    +'</div>'
    +'</div>';

  document.getElementById('resultContainer').innerHTML =
    '<div class="result">'
    // Header
    +'<div class="card-header"><div>'
    +'<div class="card-title">Statistik Baterai iPhone</div>'
    +'<div class="card-date" style="margin-top:4px">📅 '+date+' &nbsp;·&nbsp; '+filename+'</div>'
    +'</div><span class="badge '+badgeClass+'">'+badgeText+'</span></div>'
    // Health
    +'<div class="health-section">'
    +'<div class="health-ring">'+ring(pct,color)+'<div class="health-ring-text"><div class="health-num" style="color:'+color+'">'+pct+'</div><div class="health-pct">%</div></div></div>'
    +'<div class="health-info"><h3>Kesehatan Baterai</h3><p>'+healthDesc(pct)+'</p></div>'
    +'</div>'
    // Drop alert
    + dropAlertHTML
    // Score
    + scoreHTML
    // Stats grid
    +'<div class="stats-grid">'
    +'<div class="stat-box"><div class="stat-label">MaximumFCC</div><div class="stat-value" style="color:'+(fcc?color:'var(--muted)')+'">'+(fcc??'—')+'</div>'+(fcc?'<div class="stat-unit">mAh</div>'+changeBadge(fcc,prev?.MaximumFCC,' mAh'):'')+'</div>'
    +'<div class="stat-box"><div class="stat-label">NominalCharge</div><div class="stat-value">'+(nom??'—')+'</div>'+(nom?'<div class="stat-unit">mAh</div>'+changeBadge(nom,prev?.NominalChargeCapacity,' mAh'):'')+'</div>'
    +'<div class="stat-box"><div class="stat-label">AppleRawMax</div><div class="stat-value">'+(raw??'—')+'</div>'+(raw?'<div class="stat-unit">mAh</div>'+changeBadge(raw,prev?.AppleRawMaxCapacity,' mAh'):'')+'</div>'
    +'<div class="stat-box"><div class="stat-label">Cycle Count</div><div class="stat-value">'+(cyc??'—')+'</div>'+(cyc?'<div class="stat-unit">siklus</div>'+changeBadge(cyc,prev?.CycleCount,' siklus'):'')+'</div>'
    +'</div>'
    // Explanation
    +'<div class="explanation"><h4>// penjelasan</h4>'
    +(fcc?'<div class="exp-item"><div class="exp-key">MaximumFCC — '+fcc+' mAh</div><div class="exp-val">Kapasitas maksimum tertinggi yang pernah dicatat sistem. Sifatnya lifetime max, hanya bisa naik atau stagnan.</div></div>':'')
    +(nom?'<div class="exp-item"><div class="exp-key">NominalChargeCapacity — '+nom+' mAh</div><div class="exp-val">Kapasitas "resmi" yang diakui sistem untuk estimasi baterai sehari-hari. Dihitung ulang secara dinamis.</div></div>':'')
    +(raw?'<div class="exp-item"><div class="exp-key">AppleRawMaxCapacity — '+raw+' mAh</div><div class="exp-val">Pembacaan mentah langsung dari chip baterai sebelum diproses sistem.</div></div>':'')
    +(cyc?'<div class="exp-item"><div class="exp-key">Cycle Count — '+cyc+' siklus</div><div class="exp-val">'+cycleDesc(cyc)+'</div></div>':'')
    +(data.batteryTrusted!==null?'<div class="exp-item"><div class="exp-key" style="color:'+(data.batteryTrusted?'var(--green)':'var(--red)')+'">Baterai Original Apple — '+(data.batteryTrusted?'✅ Ya':'❌ Non-original')+'</div><div class="exp-val">'+(data.batteryTrusted?'Baterai diakui Apple sebagai komponen original.':'Baterai mungkin sudah diganti dengan part non-original.')+'</div></div>':'')
    +'</div>'
    // Verdict
    +'<div class="verdict">'+healthDesc(pct)+(cyc?' '+cycleDesc(cyc):'')+'</div>'
    // Predict card
    + predHTML
    // Summary
    + summHTML
    // Chart
    + chartHTML
    // Trend bars
    + trendHTML
    // Notes
    + notesHTML
    // Actions
    +'<div class="actions">'
    +'<button class="btn btn-primary" onclick="document.getElementById(\'fileInput\').click()">Upload File Baru</button>'
    +'<button class="btn btn-ghost" onclick="window.print()">🖨️ Print / Save PDF</button>'
    +'</div>'
    +'</div>';

  // Init chart after DOM ready
  setTimeout(() => initChart(history), 100);
}

function saveCurrentNote() {
  const note = document.getElementById('noteInput')?.value || '';
  if (currentDate) {
    saveNote(currentDate, note);
    const saved = document.getElementById('notesSaved');
    if (saved) { saved.style.opacity='1'; setTimeout(()=>saved.style.opacity='0',2000); }
  }
}

// ── Process file ──────────────────────────────────────────────────────
async function processText(text, filename) {
  const data = parseFile(text);
  const date = extractDate(filename);
  const history = await getHistory();
  const prev = history.length ? history[0].raw : null;
  const isOsUpdate = /"rolloverReason":"osUpdate"/.test(text);

  if (data._formatType === 'none') {
    document.getElementById('errorBox').style.display = 'none';
    const lastEntry = history.length ? history[0] : null;
    const msg = isOsUpdate
      ? 'File <strong>'+filename+'</strong> di-generate saat update iOS — data baterai tidak tersedia.'
      : 'File <strong>'+filename+'</strong> tidak mengandung data baterai (data aktivitas umum).';
    if (lastEntry && lastEntry.raw) {
      await render(lastEntry.raw, lastEntry.date, lastEntry.filename||lastEntry.date, history[1]?.raw??null);
      const existing = document.getElementById('resultContainer').innerHTML;
      document.getElementById('resultContainer').innerHTML =
        '<div style="background:rgba(255,159,10,0.08);border:1px solid rgba(255,159,10,0.3);border-radius:16px;padding:16px 20px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px">'
        +'<span style="font-size:18px;flex-shrink:0">⚠️</span>'
        +'<div style="font-family:var(--mono);font-size:11px;color:rgba(255,159,10,0.9);line-height:1.7">'+msg+'<br><strong>Menampilkan data terakhir yang valid ('+lastEntry.date+').</strong></div>'
        +'</div>' + existing;
    } else {
      document.getElementById('errorBox').style.display = 'block';
      document.getElementById('errorBox').textContent = isOsUpdate
        ? '❌ File ini di-generate saat update iOS. Upload file lain dengan tanggal sebelum update.'
        : '❌ Data baterai tidak ditemukan. Coba file dengan nomor _0002_, _0004_, atau _000_.';
    }
    await renderHistory(); return;
  }

  document.getElementById('errorBox').style.display = 'none';
  const nomVal = data.NominalChargeCapacity || prev?.NominalChargeCapacity || 0;
  await saveHistory({ date, filename, nom:nomVal, pct:data.MaximumCapacityPercent, raw:data });
  await render(data, date, filename, prev);
  await renderHistory();
}
function handleFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = e => processText(e.target.result, file.name);
  r.readAsText(file);
}

// ── History UI ────────────────────────────────────────────────────────
async function renderHistory(activeDateHL=null) {
  const h = await getHistory();
  const sec  = document.getElementById('historySection');
  const list = document.getElementById('historyList');
  const filt = document.getElementById('monthFilter');
  if (h.length<=1) { sec.style.display='none'; return; }
  sec.style.display = 'block';
  const months = [...new Set(h.map(e=>getYearMonth(e.date)))].sort((a,b)=>b.localeCompare(a));
  filt.innerHTML = '<div class="month-tab '+(activeMonth==='all'?'active':'')+'" onclick="setMonthFilter(\'all\')">Semua</div>'
    +months.map(ym=>'<div class="month-tab '+(activeMonth===ym?'active':'')+'" onclick="setMonthFilter(\''+ym+'\')">'+formatMonthLabel(ym)+'</div>').join('');
  const filtered = activeMonth==='all' ? h : h.filter(e=>getYearMonth(e.date)===activeMonth);
  if (!filtered.length) { list.innerHTML='<div class="history-empty">— nggak ada data di bulan ini</div>'; return; }
  const notes = getNotes();
  list.innerHTML = filtered.map(e => {
    const hasnote = notes[e.date] ? ' 📝' : '';
    const isActive = activeDateHL === e.date ? 'active-pill' : '';
    return `
      <div class="history-pill ${isActive}" style="padding-right:6px">
        <span class="dot" onclick="reloadHistory('${e.date}')" style="cursor:pointer;flex-shrink:0"></span>
        <span onclick="reloadHistory('${e.date}')" style="cursor:pointer;flex:1">${e.date} ·${e.nom || '–'} mAh · ${e.pct}\%${hasnote}</span>
        <span onclick="deleteHistory('${e.date}')" title="Hapus" style="cursor:pointer;color:rgba(255,69,58,0.4);font-size:14px;padding:0 4px;border-radius:4px;line-height:1;transition:color 0.2s;flex-shrink:0" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='rgba(255,69,58,0.4)'">✕</span>
      </div>
    `;
  }).join('');
}

async function deleteHistory(date) {
  if (!confirm('Hapus riwayat ' + date + '?')) return;
  await deleteHistoryFromDB(date);
  _cache = null;
  const h = await getHistory();
  if (currentDate === date) {
    if (h.length > 0) {
      const next = h[0];
      await render(next.raw, next.date, next.filename||next.date, h[1]?.raw??null);
    } else {
      document.getElementById('resultContainer').innerHTML = '';
      currentDate = null;
    }
  }
  await renderHistory();
}

function setMonthFilter(ym) { activeMonth=ym; renderHistory(); }

async function reloadHistory(date) {
  const h = await getHistory();
  const entry = h.find(x=>x.date===date);
  if (!entry) return;
  const idx = h.indexOf(entry);
  await render(entry.raw, entry.date, entry.filename||entry.date, h[idx+1]?.raw??null);
  await renderHistory(date);
}
